name: Compilar APK DedSec

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
          pip install --upgrade pip setuptools
          pip install buildozer cython==0.29.33

      - name: Crear archivo de configuración buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = DedSec App
          package.name = decsecapp
          package.domain = org.dedsec
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.allow_backup = True
          android.minapi = 21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Compilar APK con Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: DedSec-APK-Instalable
          path: bin/*.apk
          
