name: Compilar APK DedSec

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = DedSec App
          package.name = decsecapp
          package.domain = org.dedsec
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.allow_backup = True
          android.minapi = 21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Compilar APK con Buildozer Action
        uses: ArtemShedko/action-buildozer@v1
        with:
          command: buildozer -v android debug
          subfolder: '.'

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: DedSec-APK-Instalable
          path: bin/*.apk
          
